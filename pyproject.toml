[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "spherex-streak"
version         = "0.1.0"
description     = "Non-destructive satellite streak detection for NASA SPHEREx FITS images"
requires-python = ">=3.10"
dependencies    = [
    "astropy>=5.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "torch>=2.1",
    "streamlit>=1.32",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
pythonpath   = ["src"]
